name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
            flags: arch=universal

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python (for SCons)
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install SCons
        run: python -m pip install scons

      - name: Build
        run: scons platform=${{ matrix.platform }} target=${{ matrix.target }} ${{ matrix.flags }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.target }}
          path: project/addons/DampedSprings/bin/
          if-no-files-found: error

  package:
    name: Package release zip
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download built binaries
        uses: actions/download-artifact@v7
        with:
          pattern: bin-*
          path: project/addons/DampedSprings/bin
          merge-multiple: true

      - name: Zip addon
        run: |
          cd project
          zip -r "../DampedSprings-${{ github.event.release.tag_name }}.zip" addons

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "DampedSprings-${{ github.event.release.tag_name }}.zip"
